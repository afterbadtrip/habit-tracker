<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <title>HabitFlow Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(85px + env(safe-area-inset-bottom));
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 20px; }
    .active-scale:active { transform: scale(0.96); transition: transform 0.1s; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen px-4 pt-4">

  <!-- Шапка -->
  <header class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">HabitFlow</h1>
      <p id="currentDateText" class="text-xs text-zinc-400">Отслеживание дисциплины</p>
    </div>
    <button onclick="goToday()" class="px-3 py-1.5 text-xs font-semibold bg-zinc-800 text-emerald-400 rounded-xl border border-zinc-700 active-scale">
      Сегодня
    </button>
  </header>

  <!-- Карусель дней недели -->
  <div id="daysCarousel" class="grid grid-cols-7 gap-1.5 mb-5"></div>

  <!-- Вкладка: СЕГОДНЯ -->
  <main id="tab-today" class="space-y-4">
    <!-- Карточка прогресса дня -->
    <div class="card p-4 flex items-center justify-between bg-gradient-to-br from-zinc-900 to-zinc-950">
      <div class="flex items-center gap-4">
        <div class="relative w-16 h-16 flex items-center justify-center">
          <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
            <path class="text-zinc-800" stroke-width="3.8" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path id="progressRing" class="text-emerald-400 transition-all duration-300" stroke-dasharray="0, 100" stroke-width="3.8" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          </svg>
          <span id="progressText" class="absolute text-sm font-bold">0%</span>
        </div>
        <div>
          <h2 id="motivationTitle" class="font-bold text-base">Включайся в режим!</h2>
          <p id="motivationSub" class="text-xs text-zinc-400 mt-0.5">Закрой задачи на выбранный день</p>
        </div>
      </div>
    </div>

    <!-- Список привычек (крупные кнопки под палец) -->
    <div>
      <div class="flex items-center justify-between mb-2.5 px-1">
        <h3 class="text-sm font-semibold text-zinc-300">Привычки на день</h3>
        <span id="completedCount" class="text-xs text-zinc-500 font-medium">0/0</span>
      </div>
      <div id="habitsList" class="space-y-2.5"></div>
    </div>

    <!-- Быстрые задачи (Цели на день) -->
    <div class="card p-4 mt-4">
      <h3 class="text-sm font-semibold text-zinc-300 mb-3">Быстрые цели на сегодня</h3>
      <div class="flex gap-2 mb-3">
        <input id="goalInput" type="text" placeholder="Добавить задачу..." class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        <button onclick="addGoal()" class="bg-emerald-500 text-zinc-950 font-bold px-4 rounded-xl active-scale">+</button>
      </div>
      <div id="goalsList" class="space-y-2"></div>
    </div>
  </main>

  <!-- Вкладка: АНАЛИТИКА -->
  <section id="tab-stats" class="hidden space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="card p-4">
        <span class="text-xs text-zinc-400">Лучший стрик</span>
        <div id="bestStreakStat" class="text-2xl font-bold text-amber-400 mt-1">🔥 0 дн.</div>
      </div>
      <div class="card p-4">
        <span class="text-xs text-zinc-400">Выполнено за неделю</span>
        <div id="weeklyRateStat" class="text-2xl font-bold text-emerald-400 mt-1">0%</div>
      </div>
    </div>

    <!-- Столбчатый график по дням недели -->
    <div class="card p-4">
      <h3 class="text-sm font-semibold text-zinc-300 mb-4">Динамика за неделю</h3>
      <div id="weeklyBarChart" class="grid grid-cols-7 gap-2 items-end h-36 pt-4 px-1"></div>
    </div>

    <!-- Рейтинг серий по привычкам -->
    <div class="card p-4">
      <h3 class="text-sm font-semibold text-zinc-300 mb-3">Серии по привычкам</h3>
      <div id="streaksBreakdown" class="space-y-3"></div>
    </div>
  </section>

  <!-- Вкладка: УПРАВЛЕНИЕ -->
  <section id="tab-settings" class="hidden space-y-4">
    <div class="card p-4">
      <h3 class="text-sm font-semibold text-zinc-300 mb-3">Добавить новую привычку</h3>
      <div class="flex gap-2 mb-3">
        <input id="habitEmoji" type="text" value="⚡" class="w-12 text-center bg-zinc-900 border border-zinc-700 rounded-xl py-2.5 text-base">
        <input id="habitName" type="text" placeholder="Название привычки..." class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      </div>
      <button onclick="addHabit()" class="w-full bg-emerald-500 text-zinc-950 font-bold py-2.5 rounded-xl active-scale">Сохранить привычку</button>
    </div>

    <div class="card p-4">
      <h3 class="text-sm font-semibold text-zinc-300 mb-3">Удаление привычек</h3>
      <div id="manageHabitsList" class="space-y-2"></div>
    </div>

    <button onclick="resetDemo()" class="w-full py-3 text-xs font-semibold text-red-400 bg-zinc-900 border border-zinc-800 rounded-2xl active-scale">
      Сбросить всё к демо-данным
    </button>
  </section>

  <!-- Нижний Таббар под большой палец -->
  <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-lg border-t border-zinc-800 px-6 py-2 pb-5 z-50">
    <div class="max-w-md mx-auto flex justify-around items-center">
      <button onclick="switchTab('today')" id="nav-today" class="flex flex-col items-center gap-1 text-emerald-400 active-scale">
        <span class="text-xl">☑️</span>
        <span class="text-[11px] font-medium">Сегодня</span>
      </button>
      <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-1 text-zinc-500 active-scale">
        <span class="text-xl">📊</span>
        <span class="text-[11px] font-medium">Аналитика</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-zinc-500 active-scale">
        <span class="text-xl">⚙️</span>
        <span class="text-[11px] font-medium">Настройки</span>
      </button>
    </div>
  </nav>

  <script>
    const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const todayIndex = (new Date().getDay() + 6) % 7;
    let selectedDay = todayIndex;

    const DEFAULT_DATA = {
      habits: [
        { id: 1, name: 'Силовая тренировка', icon: '🏋️', days: [true, false, true, false, true, false, false] },
        { id: 2, name: 'Аим-тренер 30 мин', icon: '🎯', days: [true, true, true, true, false, false, false] },
        { id: 3, name: 'Практика английского', icon: '🇬🇧', days: [true, true, false, true, true, false, false] },
        { id: 4, name: 'Лаба по ИБ / Linux', icon: '💻', days: [false, true, true, true, false, false, false] },
        { id: 5, name: 'Чтение 20 страниц', icon: '📖', days: [true, true, true, false, false, false, false] }
      ],
      goals: [
        { id: 101, text: 'Разобрать конспект по сетям', done: false },
        { id: 102, text: 'Закрыть норму по белку', done: true }
      ]
    };

    let state = JSON.parse(localStorage.getItem('habitflow_mobile_v2')) || DEFAULT_DATA;

    function save() {
      localStorage.setItem('habitflow_mobile_v2', JSON.stringify(state));
      renderAll();
    }

    function vibrate(ms = 15) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function calcStreak(daysArr) {
      let current = 0;
      for (let i = selectedDay; i >= 0; i--) {
        if (daysArr[i]) current++;
        else break;
      }
      return current;
    }

    function renderDays() {
      const container = document.getElementById('daysCarousel');
      container.innerHTML = DAYS.map((d, idx) => {
        const isSelected = idx === selectedDay;
        const isToday = idx === todayIndex;
        const total = state.habits.length;
        const done = state.habits.filter(h => h.days[idx]).length;
        const allDone = total > 0 && done === total;

        return `
          <button onclick="selectDay(${idx})" class="flex flex-col items-center py-2.5 rounded-2xl border transition-all active-scale ${
            isSelected
              ? 'bg-emerald-500 text-zinc-950 border-emerald-400 font-bold shadow-lg shadow-emerald-500/20'
              : 'bg-zinc-900/90 text-zinc-300 border-zinc-800'
          }">
            <span class="text-[11px] opacity-80">${d}</span>
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs mt-1 ${
              allDone && !isSelected ? 'bg-emerald-500/20 text-emerald-400 font-bold' : ''
            }">
              ${allDone ? '✓' : done + '/' + total}
            </div>
            ${isToday ? `<span class="w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-zinc-950' : 'bg-emerald-400'}"></span>` : '<span class="w-1.5 h-1.5 mt-1"></span>'}
          </button>
        `;
      }).join('');
    }

    function renderHabits() {
      const list = document.getElementById('habitsList');
      const total = state.habits.length;
      const doneCount = state.habits.filter(h => h.days[selectedDay]).length;
      const percent = total ? Math.round((doneCount / total) * 100) : 0;

      document.getElementById('completedCount').textContent = `${doneCount}/${total}`;
      document.getElementById('progressRing').setAttribute('stroke-dasharray', `${percent}, 100`);
      document.getElementById('progressText').textContent = `${percent}%`;

      if (percent === 100 && total > 0) {
        document.getElementById('motivationTitle').textContent = 'День закрыт на 100%! 🔥';
        document.getElementById('motivationSub').textContent = 'Железная дисциплина, так держать';
      } else if (percent >= 50) {
        document.getElementById('motivationTitle').textContent = 'Отличный темп! ⚡';
        document.getElementById('motivationSub').textContent = `Осталось добить ${total - doneCount} прив.`;
      } else {
        document.getElementById('motivationTitle').textContent = `Фокус: ${DAYS[selectedDay]}`;
        document.getElementById('motivationSub').textContent = 'Отмечай выполненные привычки нажатием';
      }

      list.innerHTML = state.habits.map(h => {
        const isDone = h.days[selectedDay];
        const streak = calcStreak(h.days);
        return `
          <div onclick="toggleHabit(${h.id})" class="card p-3.5 flex items-center justify-between cursor-pointer active-scale transition-all ${
            isDone ? 'border-emerald-500/40 bg-emerald-950/10' : ''
          }">
            <div class="flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-2xl bg-zinc-800/80 flex items-center justify-center text-xl">
                ${h.icon}
              </div>
              <div>
                <div class="font-semibold text-sm ${isDone ? 'line-through text-zinc-400' : 'text-zinc-100'}">${h.name}</div>
                <div class="text-xs text-amber-400 font-medium mt-0.5">🔥 Серия: ${streak} дн.</div>
              </div>
            </div>
            <div class="w-8 h-8 rounded-xl flex items-center justify-center border-2 transition-all ${
              isDone ? 'bg-emerald-500 border-emerald-400 text-zinc-950 font-bold' : 'border-zinc-700 bg-zinc-900'
            }">
              ${isDone ? '✓' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderGoals() {
      const list = document.getElementById('goalsList');
      list.innerHTML = state.goals.map(g => `
        <div class="flex items-center justify-between bg-zinc-900/70 px-3.5 py-2.5 rounded-xl border border-zinc-800/80">
          <div onclick="toggleGoal(${g.id})" class="flex items-center gap-3 flex-1 cursor-pointer">
            <div class="w-5 h-5 rounded-md border flex items-center justify-center text-xs ${
              g.done ? 'bg-emerald-500 border-emerald-400 text-zinc-950 font-bold' : 'border-zinc-600'
            }">${g.done ? '✓' : ''}</div>
            <span class="text-sm ${g.done ? 'line-through text-zinc-500' : 'text-zinc-200'}">${g.text}</span>
          </div>
          <button onclick="deleteGoal(${g.id})" class="text-zinc-500 px-2 text-sm">✕</button>
        </div>
      `).join('');
    }

    function renderStats() {
      const totalPossible = state.habits.length * 7;
      let totalDone = 0;
      let maxStreak = 0;

      state.habits.forEach(h => {
        totalDone += h.days.filter(Boolean).length;
        let cur = 0;
        h.days.forEach(d => {
          if (d) { cur++; if (cur > maxStreak) maxStreak = cur; }
          else cur = 0;
        });
      });

      const weeklyRate = totalPossible ? Math.round((totalDone / totalPossible) * 100) : 0;
      document.getElementById('bestStreakStat').textContent = `🔥 ${maxStreak} дн.`;
      document.getElementById('weeklyRateStat').textContent = `${weeklyRate}%`;

      // График по дням
      const chart = document.getElementById('weeklyBarChart');
      chart.innerHTML = DAYS.map((d, idx) => {
        const done = state.habits.filter(h => h.days[idx]).length;
        const pct = state.habits.length ? Math.round((done / state.habits.length) * 100) : 0;
        return `
          <div class="flex flex-col items-center h-full justify-end gap-1.5">
            <span class="text-[10px] text-zinc-400">${pct}%</span>
            <div class="w-full bg-zinc-800 rounded-t-lg overflow-hidden flex items-end h-24">
              <div style="height: ${Math.max(pct, 8)}%" class="w-full ${idx === selectedDay ? 'bg-emerald-400' : 'bg-emerald-600/70'} rounded-t-lg transition-all"></div>
            </div>
            <span class="text-xs text-zinc-400 font-medium">${d}</span>
          </div>
        `;
      }).join('');
